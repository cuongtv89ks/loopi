<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loopi</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 960px; margin: 0 auto; padding: 16px; }
    header nav a { margin-right: 16px; }
    .hour h2 { font-size: 1rem; border-bottom: 1px solid #8884; }
    .item { display: flex; gap: 12px; align-items: center; padding: 4px 0; list-style: none; }
    .item video { max-width: 320px; }
    .frames { display: flex; flex-wrap: wrap; gap: 8px; }
    .frames figure { margin: 0; width: 224px; }
    .frames img { width: 224px; height: auto; border-radius: 4px; }
    .chapter h2 { font-size: 1.1rem; border-bottom: 1px solid #8884; }
    .chapter h2 time, .speech time, .marker time { font-variant-numeric: tabular-nums; color: #888; }
    .commitment { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
    .commitment.done span:first-child, .commitment.dismissed span:first-child { text-decoration: line-through; color: #888; }
    form.inline { display: inline; }
    .hits { padding: 0; } .hit { display: flex; gap: 12px; list-style: none; padding: 6px 0; border-bottom: 1px solid #8884; }
    .hit p { margin: 4px 0; }
    .frames figcaption, .muted { font-size: 0.85rem; color: #888; }
    .lang { font-size: 0.75rem; border: 1px solid #8886; border-radius: 4px; padding: 0 4px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid #8884; padding: 4px; text-align: left; vertical-align: top; }
    .err { color: #c33; }
    .card { border: 1px solid #8886; border-radius: 8px; padding: 12px; margin: 12px 0; }
    .online { color: #2a2; } .offline { color: #999; }
    code { word-break: break-all; }
    textarea, input, select { max-width: 100%; box-sizing: border-box; } textarea { width: 100%; }
    .scroll { overflow-x: auto; }
  </style>
</head>
<body>
  <header><nav><a href="/">Hôm nay</a><a href="/search">Tìm kiếm</a><a href="/vlog">Vlog</a><a href="/pipeline">Xử lý</a><a href="/devices">Thiết bị</a><a href="/versions">Phiên bản</a><a href="/settings">Cài đặt</a><a href="/eval">Đánh giá</a></nav></header>
  <div id="hx-error" class="err" role="alert"></div>
  <main>{% block content %}{% endblock %}</main>
  <script>
    const HX_ERRORS = {403: "Yêu cầu không hợp lệ", 404: "Không tìm thấy, hãy tải lại trang",
                       409: "Job không còn ở trạng thái lỗi, hãy tải lại trang",
                       422: "Giá trị không hợp lệ, hãy kiểm tra lại"};
    document.body.addEventListener("htmx:responseError", (e) => {
      document.getElementById("hx-error").textContent =
        HX_ERRORS[e.detail.xhr.status] || "Có lỗi, thử lại";
    });
    document.body.addEventListener("htmx:sendError", () => {
      document.getElementById("hx-error").textContent = "Có lỗi, thử lại";
    });
    document.body.addEventListener("htmx:beforeRequest", () => {
      document.getElementById("hx-error").textContent = "";
    });
    // A link to one moment (a chat citation) opens the folded section that holds it.
    function revealHash() {
      const target = location.hash && document.getElementById(location.hash.slice(1));
      if (!target) return;
      for (let d = target.closest("details"); d; d = d.parentElement.closest("details")) d.open = true;
      target.scrollIntoView();
    }
    window.addEventListener("hashchange", revealHash);
    revealHash();
  </script>
</body>
</html>
