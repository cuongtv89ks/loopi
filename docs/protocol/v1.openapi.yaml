openapi: 3.1.0
info:
  title: Loopi device-brain sync protocol
  version: 1.0.0
  description: |
    Device endpoints served by the brain behind Caddy. Every endpoint except
    /v1/pair requires mTLS. Caddy forwards the client certificate's SHA-256
    fingerprint (lowercase hex of DER) as X-Loopi-Client-Fingerprint and the
    brain maps it to a device. Timestamps are RFC 3339 in UTC.
paths:
  /v1/pair:
    post:
      operationId: pair
      summary: Exchange a one-time token and a P-256 CSR for a client certificate.
      parameters:
        - { $ref: '#/components/parameters/AgentVersion' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
      responses:
        '201':
          description: Paired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '426': { $ref: '#/components/responses/Error' }
  /v1/items/{id}:
    put:
      operationId: putItem
      summary: Upload one captured segment or marker. Idempotent per id.
      description: |
        Limits enforced by the brain: the body is at most 67108864 bytes (64 MiB) for every
        kind, and a marker body is at most 65536 bytes (64 KiB). The Content-Type must match
        X-Loopi-Kind (video -> video/h264, audio -> audio/ogg, marker -> application/json);
        a mismatch is 422. X-Loopi-End must not be before X-Loopi-Start and
        End - Start must be at most 3600 s; otherwise 422.
      x-loopi-max-item-bytes: 67108864
      x-loopi-max-marker-bytes: 65536
      x-loopi-max-segment-seconds: 3600
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
        - name: X-Loopi-Kind
          in: header
          required: true
          schema: { type: string, enum: [video, audio, marker] }
        - { name: X-Loopi-Start, in: header, required: true, schema: { type: string, format: date-time } }
        - name: X-Loopi-End
          in: header
          required: true
          description: End of the segment. Must satisfy End >= Start and End - Start <= 3600 seconds.
          schema: { type: string, format: date-time }
        - name: X-Loopi-Sha256
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - name: X-Loopi-Video-Fps
          in: header
          required: false
          description: Frame rate of a raw H.264 video segment (raw H.264 has no timing); defaults to 2.
          schema: { type: integer, minimum: 1, maximum: 30 }
        - { $ref: '#/components/parameters/AgentVersion' }
      requestBody:
        required: true
        content:
          video/h264:
            description: Body for X-Loopi-Kind video, at most 64 MiB.
            schema: { type: string, format: binary }
          audio/ogg:
            description: Body for X-Loopi-Kind audio, at most 64 MiB.
            schema: { type: string, format: binary }
          application/json:
            description: Body for X-Loopi-Kind marker, at most 64 KiB.
            schema: { $ref: '#/components/schemas/Marker' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAck' }
        '200':
          description: Already stored with the same sha256.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemAck' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413':
          description: >-
            Body larger than 67108864 bytes (64 MiB), or a marker body larger than
            65536 bytes (64 KiB). Error with a human-readable detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '426': { $ref: '#/components/responses/Error' }
        '507': { $ref: '#/components/responses/Error' }
  /v1/heartbeat:
    post:
      operationId: heartbeat
      summary: Report device status, ack commands, receive pending commands.
      parameters:
        - { $ref: '#/components/parameters/AgentVersion' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Heartbeat' }
      responses:
        '200':
          description: Pending commands, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeartbeatResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '426': { $ref: '#/components/responses/Error' }
  /v1/ota/{bundle}:
    get:
      operationId: getBundle
      summary: Download a signed RAUC update bundle the brain offers (P4a, spec D27).
      description: |
        Only paired, unrevoked devices (mTLS). The bundle name comes from an update command.
        A Range request (bytes=<start>-) resumes an interrupted download and is answered with 206.
      parameters:
        - name: bundle
          in: path
          required: true
          schema: { $ref: '#/components/schemas/BundleName' }
        - name: Range
          in: header
          required: false
          schema: { type: string, pattern: '^bytes=[0-9]+-$' }
        - { $ref: '#/components/parameters/AgentVersion' }
      responses:
        '200':
          description: The whole bundle.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: The bundle from the requested byte to its end.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '416':
          description: The range starts at or past the end of the bundle.
        '426': { $ref: '#/components/responses/Error' }
components:
  parameters:
    AgentVersion:
      name: X-Loopi-Agent-Version
      in: header
      required: false
      schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+' }
  responses:
    Error:
      description: Error with a human-readable detail.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    Error:
      type: object
      required: [detail]
      properties:
        detail: {}
    HwInfo:
      type: object
      additionalProperties: false
      required: [model, serial, agent_version]
      properties:
        model: { type: string, maxLength: 100 }
        serial: { type: string, maxLength: 100 }
        agent_version: { type: string, maxLength: 32 }
    PairRequest:
      type: object
      additionalProperties: false
      required: [token, csr_pem, hw_info]
      properties:
        token: { type: string, minLength: 1, maxLength: 32 }
        csr_pem: { type: string, maxLength: 8192 }
        hw_info: { $ref: '#/components/schemas/HwInfo' }
    PairResponse:
      type: object
      additionalProperties: false
      required: [device_id, cert_pem, ca_cert_pem, ca_fingerprint]
      properties:
        device_id: { $ref: '#/components/schemas/Ulid' }
        cert_pem: { type: string }
        ca_cert_pem: { type: string }
        ca_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
    Marker:
      description: >-
        Any JSON object (arbitrary keys), UTF-8, at most 65536 bytes serialized, without NUL
        characters. An empty body is treated as {}.
      type: object
    ItemAck:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        status: { type: string, enum: [created, duplicate] }
    Heartbeat:
      type: object
      additionalProperties: false
      required: [agent_version, uptime_s, disk_used_pct, queue_depth, clock_synced, paused,
                 audio_enabled, recording_video, recording_audio, acked_command_ids]
      properties:
        agent_version: { type: string, maxLength: 32 }
        uptime_s: { type: integer, minimum: 0 }
        soc_temp_c: { type: [number, 'null'] }
        disk_used_pct: { type: number, minimum: 0, maximum: 100 }
        queue_depth: { type: integer, minimum: 0 }
        wifi_rssi_dbm: { type: [integer, 'null'] }
        clock_synced: { type: boolean }
        paused: { type: boolean }
        audio_enabled: { type: boolean }
        recording_video: { type: boolean }
        recording_audio: { type: boolean }
        mic_missing: { type: boolean }
        camera_failures: { type: integer, minimum: 0 }
        last_error: { type: [string, 'null'], maxLength: 500 }
        dropped_items: { type: integer, minimum: 0 }
        acked_command_ids:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Ulid' }
        os_version: { $ref: '#/components/schemas/OsVersion' }
        os_variant: { type: string, enum: [dev, prod] }
        boot_slot: { type: string, enum: [A, B] }
        ota: { $ref: '#/components/schemas/OtaReport' }
    Command:
      type: object
      description: >-
        pause and resume carry an empty payload; set_config carries {audio_enabled: boolean};
        update carries the bundle to install (P4a).
      oneOf:
        - { $ref: '#/components/schemas/PauseCommand' }
        - { $ref: '#/components/schemas/ResumeCommand' }
        - { $ref: '#/components/schemas/SetConfigCommand' }
        - { $ref: '#/components/schemas/UpdateCommand' }
      discriminator:
        propertyName: type
        mapping:
          pause: '#/components/schemas/PauseCommand'
          resume: '#/components/schemas/ResumeCommand'
          set_config: '#/components/schemas/SetConfigCommand'
          update: '#/components/schemas/UpdateCommand'
    PauseCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        type: { const: pause }
        payload: { $ref: '#/components/schemas/EmptyPayload' }
    ResumeCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        type: { const: resume }
        payload: { $ref: '#/components/schemas/EmptyPayload' }
    SetConfigCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        type: { const: set_config }
        payload:
          type: object
          additionalProperties: false
          required: [audio_enabled]
          properties:
            audio_enabled: { type: boolean }
    BundleName:
      type: string
      pattern: '^loopi-(dev|prod)-[0-9A-Za-z.+-]{1,64}\.raucb$'
    OsVersion:
      type: string
      pattern: '^[0-9A-Za-z.+-]{1,64}$'
    UpdateCommand:
      type: object
      additionalProperties: false
      required: [id, type, payload]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        type: { const: update }
        payload:
          type: object
          additionalProperties: false
          required: [bundle, version, variant, sha256, size]
          properties:
            bundle: { $ref: '#/components/schemas/BundleName' }
            version: { $ref: '#/components/schemas/OsVersion' }
            variant: { type: string, enum: [dev, prod] }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            size: { type: integer, minimum: 1, maximum: 268435456 }
    OtaReport:
      type: object
      additionalProperties: false
      required: [state, version]
      description: >-
        The device's current or latest update, until the brain has heard its outcome. command_id
        is absent for an update the brain did not request (the first move to A/B slots, by hand).
      properties:
        command_id: { $ref: '#/components/schemas/Ulid' }
        state:
          type: string
          enum: [downloading, installing, rebooting, trying, succeeded, rolled_back, failed]
        version: { $ref: '#/components/schemas/OsVersion' }
        error: { type: [string, 'null'], maxLength: 500 }
    EmptyPayload:
      type: object
      additionalProperties: false
      maxProperties: 0
    HeartbeatResponse:
      type: object
      additionalProperties: false
      required: [commands]
      properties:
        commands:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Command' }
