[package]
name = "loopi-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Loopi capture agent for Raspberry Pi Zero W"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
hex = "0.4"
libc = "0.2"
ogg = "0.9"
opus = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "fs", "sync", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ulid = "1"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"
gpiocdev = "0.7"
sd-notify = "0.4"

[dev-dependencies]
jsonschema = "0.26"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["test-util", "rt", "macros"] }
wiremock = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
