# /data is mounted nofail, which systemd does not order before local-fs.target, so systemd-tmpfiles-setup.service
# usually runs before /data is mounted and cannot be relied on to create /data/dev/dropbear. dropbear -R needs that
# directory to write its host key (open O_CREAT|O_EXCL fails with ENOENT and every connection is dropped).
# Wait for the real /data, then create the directory. This ExecStartPre runs after Buildroot's own one, which is a
# no-op while /etc/dropbear points at /data/dev/dropbear instead of /var/run/dropbear.
[Unit]
RequiresMountsFor=/data

[Service]
ExecStartPre=/bin/mkdir -p -m 0700 /data/dev/dropbear
