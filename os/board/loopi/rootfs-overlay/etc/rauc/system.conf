# RAUC (P4a design §5, spec D26-D28). Built without the D-Bus service: the agent and the guard run the rauc CLI, so
# there is no rauc.service to order against /data. Bundles must be signed by the CA in keyring.pem (added at build).
[system]
compatible=loopi-rpi0w
bootloader=custom
mountprefix=/run/rauc
data-directory=/data/rauc
bundle-formats=-plain

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
bootloader-custom-backend=/usr/libexec/loopi/loopi-boot
post-install=/usr/libexec/loopi/rauc-post-install

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=raw
bootname=B
