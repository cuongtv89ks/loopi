# boot.vfat is not described here: post-image.sh builds it (mkfs.vfat + mcopy) before genimage runs, because the slot
# directories are laid out by the shipped loopi-boot, which genimage cannot run. The partition below takes that file
# from the images directory.

image sdcard.img {
	hdimage {
		# 4 MiB aligned partitions (SD erase blocks), like Raspberry Pi OS
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 128M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 128M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
