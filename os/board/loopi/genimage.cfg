image boot.vfat {
	vfat {
		files = {
			"bcm2708-rpi-zero-w.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/start.elf",
			"rpi-firmware/overlays",
			"zImage",
			"loopi.toml.example"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 128M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 128M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
